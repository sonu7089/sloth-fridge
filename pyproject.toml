[project]
name = "sloth-fridge"
version = "0.1.0"
description = "Local-first fridge photo to grocery list, powered by open-weight vision models running on your own hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
dev = ["pytest>=7.4"]

[project.scripts]
sloth-fridge = "sloth_fridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sloth_fridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These files hold long SQL statements, lookup tables and prompt strings.
"sloth_fridge/store.py" = ["E501"]
"sloth_fridge/normalize.py" = ["E501"]
"sloth_fridge/extractor.py" = ["E501"]
"tests/test_extractor.py" = ["E501"]
